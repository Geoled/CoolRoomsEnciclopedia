    <form id="editForm" onsubmit="return false">
      <div class="form-section"><h4>Идентификация</h4>
        <div class="stats-grid">
          <div class="form-group"><label>ID</label><input data-field="id" value="${Utils.escapeHtml(baseObj.id)}" ${!isNew ? 'readonly' : ''}></div>
          <div class="form-group"><label>Классификация</label><select data-field="cls">${classOptions}</select></div>
        </div>
        <div class="form-group"><label>Обозначение</label><input data-field="title" value="${Utils.escapeHtml(baseObj.title || baseObj.name || '')}" autofocus></div>
        ${type === 'levels' ? `<div class="form-group"><label>Кластер</label><input data-field="cluster" value="${Utils.escapeHtml(baseObj.cluster || '')}"></div>` : ''}
        <div class="stats-grid">
          <div class="form-group"><label>Теги (через запятую)</label><input data-field="tags" value="${Utils.escapeHtml((baseObj.tags || []).join(', '))}"></div>
          <div class="form-group"><label>Дата обнаружения</label><input type="date" data-field="discoveredAt" value="${Utils.escapeHtml(baseObj.discoveredAt || '')}"></div>
        </div>
      </div>
      <div class="form-section"><h4>Параметры</h4>
        <div class="stats-grid">${statsGrid}</div>
      </div>
      <div class="form-section"><h4>Описание (Markdown)</h4>
        <div class="md-editor-wrap">
          <textarea data-field="desc" rows="8" id="descInput">${Utils.escapeHtml(baseObj.desc || '')}</textarea>
          <div class="md-preview" id="descPreview"></div>
        </div>
      </div>
      ${linksSection}
      ${extraSections}
      <div class="form-section"><h4>Медиа-архив</h4>
        <div class="form-group">
          <label>Главное изображение</label>
          <input data-field="thumbnail" value="${Utils.escapeHtml(baseObj.thumbnail || '')}" placeholder="URL">
          <div class="dropzone" id="thumbDropzone" style="margin-top:0.5rem;">
            <div>Перетащите файл или нажмите для загрузки</div>
            <input type="file" id="fileUpload" accept="image/*" style="display:none">
            ${baseObj.thumbnail ? `<img src="${Utils.escapeHtml(baseObj.thumbnail)}" class="dropzone-preview" alt="">` : ''}
          </div>
        </div>
        <div class="form-group">
          <label>Дополнительные изображения</label>
          <div id="imagesContainer">${images}</div>
          <button type="button" class="btn" id="addImageBtn" style="margin-top:0.5rem;">+ Добавить изображение</button>
        </div>
      </div>
      <div class="floating-actions">
        <button type="button" class="btn" id="cancelEditBtn">Отмена</button>
        ${!isNew ? `<button type="button" class="btn" id="duplicateBtn">📋 Копия</button>` : ''}
        <button type="button" class="btn primary" id="saveBtn">💾 Сохранить</button>
      </div>
    </form>`;

  // Initialize state
  state.editing = {
    type, obj,
    dirty: false,
    dropdowns: {}
  };

  // Setup dropdowns for levels
  if (type === 'levels') {
    state.editing.dropdowns.entity = createDropdown($('#dd-entities'), state.data.entities, (baseObj.ent || []).map(Utils.strId), 'Выберите сущности');
    state.editing.dropdowns.food = createDropdown($('#dd-foods'), state.data.foods, (baseObj.foodIds || []).map(Utils.strId), 'Выберите провизию');
    state.editing.dropdowns.item = createDropdown($('#dd-items'), state.data.items, (baseObj.itemIds || []).map(Utils.strId), 'Выберите объекты');
    const inIds = baseObj.in ? baseObj.in.split(',').map(s => Utils.strId(s)).filter(Boolean) : [];
    const outIds = baseObj.out ? baseObj.out.split(',').map(s => Utils.strId(s)).filter(Boolean) : [];
    const otherLevels = state.data.levels.filter(l => !Utils.idsMatch(l.id, baseObj.id));
    state.editing.dropdowns.in = createDropdown($('#dd-in'), otherLevels, inIds, 'Входы');
    state.editing.dropdowns.out = createDropdown($('#dd-out'), otherLevels, outIds, 'Выходы');
  }

  // Markdown preview
  const descInput = $('#descInput');
  const descPreview = $('#descPreview');
  const updatePreview = () => {
    try { descPreview.innerHTML = marked.parse(descInput.value || ''); }
    catch { descPreview.textContent = descInput.value || ''; }
  };
  updatePreview();
  descInput.addEventListener('input', () => { updatePreview(); markDirty(); });

  // File upload
  const dropzone = $('#thumbDropzone');
  const fileInput = $('#fileUpload');
  dropzone.addEventListener('click', (e) => {
    if (e.target === fileInput) return;
    fileInput.click();
  });
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', async (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) await uploadThumbnail(file);
  });
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (file) await uploadThumbnail(file);
  });

  async function uploadThumbnail(file) {
    const loading = Toast.show('Загрузка изображения…', 'info');
    try {
      const url = await API.uploadImage(file);
      Toast.dismiss(loading);
      const thumbInput = $('[data-field="thumbnail"]');
      thumbInput.value = url;
      dropzone.innerHTML = `<div>Изображение загружено</div><img src="${Utils.escapeHtml(url)}" class="dropzone-preview" alt=""><input type="file" id="fileUpload" accept="image/*" style="display:none">`;
      Toast.success('Изображение загружено');
    } catch (e) {
      Toast.dismiss(loading);
      Toast.error(`Ошибка загрузки: ${e.message}`);
    }
  }

  // Add image button
  $('#addImageBtn').addEventListener('click', () => {
    const container = $('#imagesContainer');
    const entry = document.createElement('div');
    entry.className = 'image-entry';
    entry.style.cssText = 'display:flex;gap:0.5rem;margin-bottom:0.5rem;align-items:center;';
    entry.innerHTML = `
      <input class="image-url" placeholder="URL изображения" style="flex:2;">
      <input class="image-desc" placeholder="Подпись" style="flex:1;">
      <button class="btn icon-only remove-image" aria-label="Удалить изображение">×</button>`;
    container.appendChild(entry);
    markDirty();
  });

  // Remove image delegation
  $('#imagesContainer').addEventListener('click', (e) => {
    const btn = e.target.closest('.remove-image');
    if (btn) {
      btn.closest('.image-entry').remove();
      markDirty();
    }
  });

  // Mark dirty on any change
  $('#editForm').addEventListener('input', markDirty);
  $('#editForm').addEventListener('change', markDirty);

  // Buttons
  $('#cancelEditBtn').addEventListener('click', closeEdit);
  $('#saveBtn').addEventListener('click', () => saveEdit(type, obj));
  if (!isNew) {
    $('#duplicateBtn').addEventListener('click', () => {
      $('[data-field="id"]').value = String(Utils.getMaxId(state.data[type]) + 1);
      state.editing.obj = null;
      state.editing.dirty = true;
      saveEdit(type, null);
    });
  }

  dom.editModal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeEdit(force = false) {
  if (!force && state.editing?.dirty) {
    confirmDialog({
      title: 'Несохранённые изменения',
      message: 'У вас есть несохранённые изменения. Сохранить черновик?',
      confirmLabel: 'Сохранить черновик',
      cancelLabel: 'Отменить'
    }).then(saveDraft => {
      if (saveDraft) saveFormDraft();
      else Storage.remove('formDraft_' + state.editing?.type);
      finishCloseEdit();
    });
    return;
  }
  finishCloseEdit();
}

function finishCloseEdit() {
  dom.editModal.classList.remove('active');
  document.body.style.overflow = '';
  state.editing = null;
}

function saveFormDraft() {
  if (!state.editing) return;
  const form = $('#editForm');
  if (!form) return;

  const draft = {
    id: $('[data-field="id"]')?.value || '',
    title: $('[data-field="title"]')?.value || '',
    cluster: $('[data-field="cluster"]')?.value || '',
    cls: $('[data-field="cls"]')?.value || '',
    tags: $('[data-field="tags"]')?.value || '',
    desc: $('[data-field="desc"]')?.value || '',
    thumbnail: $('[data-field="thumbnail"]')?.value || '',
    discoveredAt: $('[data-field="discoveredAt"]')?.value || '',
    habitat: $('[data-field="habitat"]')?.value || '',
    behavior: $('[data-field="behavior"]')?.value || '',
    survival: $('[data-field="survival"]')?.value || '',
    props: $('[data-field="props"]')?.value || '',
    effect: $('[data-field="effect"]')?.value || '',
    stats: {}
  };

  form.querySelectorAll('[data-stat]').forEach(el => {
    draft.stats[el.dataset.stat] = parseFloat(el.value) || 0;
  });

  const images = [];
  form.querySelectorAll('.image-entry').forEach(entry => {
    const url = entry.querySelector('.image-url').value.trim();
    const desc = entry.querySelector('.image-desc').value.trim();
    if (url) images.push({ url, description: desc });
  });
  draft.images = images;

  if (state.editing.dropdowns) {
    const dd = state.editing.dropdowns;
    if (dd.entity) draft.ent = dd.entity._getSelected().map(Utils.strId);
    if (dd.food) draft.foodIds = dd.food._getSelected().map(Utils.strId);
    if (dd.item) draft.itemIds = dd.item._getSelected().map(Utils.strId);
    if (dd.in) draft.in = dd.in._getSelectedStr();
    if (dd.out) draft.out = dd.out._getSelectedStr();
  }

  Storage.set('formDraft_' + state.editing.type, draft);
}

function confirmSync(msg) {
  return window.confirm(msg);
}

async function saveEdit(type, obj) {
  const form = $('#editForm');
  if (!form) return;

  let newId = $('[data-field="id"]').value.trim();
  if (!newId) newId = String(Utils.getMaxId(state.data[type]) + 1);

  const newObj = {
    id: newId,
    cls: $('[data-field="cls"]').value,
    tags: $('[data-field="tags"]').value.split(',').map(s => s.trim()).filter(Boolean),
    stats: {},
    desc: $('[data-field="desc"]').value,
    discoveredAt: $('[data-field="discoveredAt"]').value || Utils.formatDate(new Date().toISOString()),
    thumbnail: $('[data-field="thumbnail"]').value,
    images: []
  };

  form.querySelectorAll('[data-stat]').forEach(el => {
    newObj.stats[el.dataset.stat] = parseFloat(el.value) || 0;
  });

  form.querySelectorAll('.image-entry').forEach(entry => {
    const url = entry.querySelector('.image-url').value.trim();
    const desc = entry.querySelector('.image-desc').value.trim();
    if (url) newObj.images.push({ url, description: desc });
  });

  if (type === 'levels') {
    newObj.title = $('[data-field="title"]').value;
    newObj.cluster = $('[data-field="cluster"]').value || '';
  } else {
    newObj.name = $('[data-field="title"]').value;
  }

  ['habitat', 'behavior', 'survival', 'props', 'effect'].forEach(field => {
    const el = form.querySelector(`[data-field="${field}"]`);
    if (el) newObj[field] = el.value;
  });

  if (type === 'levels' && state.editing?.dropdowns) {
    const dd = state.editing.dropdowns;
    newObj.ent = dd.entity._getSelected().map(Utils.strId);
    newObj.foodIds = dd.food._getSelected().map(Utils.strId);
    newObj.itemIds = dd.item._getSelected().map(Utils.strId);
    newObj.in = dd.in._getSelectedStr();
    newObj.out = dd.out._getSelectedStr();
  }

  const filename = `${type}/${type}_${newObj.id}.json`;
  const loading = Toast.show('Сохранение…', 'info');

  try {
    await API.commitFile(filename, newObj, obj?._sha);
    Toast.dismiss(loading);

    Storage.remove('formDraft_' + type);

    if (obj) {
      const idx = state.data[type].findIndex(o => Utils.idsMatch(o.id, obj.id));
      if (idx !== -1) {
        state.cardCache.delete(state.data[type][idx]);
        state.data[type][idx] = { ...newObj, _sha: obj._sha, _folder: type };
      }
    } else {
      state.data[type].push({ ...newObj, _folder: type });
    }

    finishCloseEdit(true);
    Toast.success(`Запись #${newObj.id} сохранена`);
    renderTree();
    renderContent();
  } catch (e) {
    Toast.dismiss(loading);
    Toast.error(`Ошибка сохранения: ${e.message}`);
  }
}

// ═══════════════════════════════════════════════════════
// SECTION SWITCHING
// ═══════════════════════════════════════════════════════

async function switchSection(section) {
  if (section === state.section) return;

  state.section = section;
  state.filters = { search: '', tag: '', sort: 'default' };

  // Update tabs
  $$('.tab-btn').forEach(b => {
    const isActive = b.dataset.tab === section;
    b.classList.toggle('active', isActive);
    b.setAttribute('aria-selected', isActive);
  });

  // Update breadcrumbs
  if (section === 'home') {
    dom.breadcrumbs.innerHTML = 'TERMINAL';
  } else {
    dom.breadcrumbs.innerHTML = `<span data-nav="home">TERMINAL</span> › ${SECTION_LABELS[section] || section.toUpperCase()}`;
  }

  // Load data if not loaded
  if (section !== 'home' && !state.loaded.has(section)) {
    showSkeletons();
    await loadSection(section);
  }

  renderTree();
  renderContent();
}

function showSkeletons() {
  dom.contentArea.innerHTML = `
    <div class="terminal-line">ЗАГРУЗКА…</div>
    <div class="grid">
      ${Array.from({ length: 6 }).map(() => '<div class="skeleton-card"></div>').join('')}
    </div>`;
}

// ═══════════════════════════════════════════════════════
// RENDER ENTRY POINT
// ═══════════════════════════════════════════════════════

function renderContent() {
  if (state.section === 'home') {
    renderHome();
    return;
  }
  renderList();
}

// ═══════════════════════════════════════════════════════
// EXPORT / IMPORT
// ═══════════════════════════════════════════════════════

function exportAllData() {
  const allData = {
    meta: { exported: new Date().toISOString(), version: '2.0' },
    levels: state.data.levels,
    entities: state.data.entities,
    items: state.data.items,
    foods: state.data.foods
  };
  const blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tihie_rooms_backup_${Utils.formatDate(new Date().toISOString())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  Toast.success('База экспортирована');
}

function importAllData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    try {
      const text = await file.text();
      const imported = JSON.parse(text);

      if (!imported.levels || !imported.entities || !imported.items || !imported.foods) {
        Toast.error('Неверный формат файла');
        return;
      }

      const total = imported.levels.length + imported.entities.length + imported.items.length + imported.foods.length;
      const confirmed = await confirmDialog({
        title: 'Импорт данных',
        message: `Импортировать ${total} записей? Существующие данные будут перезаписаны.`,
        confirmLabel: 'Импортировать'
      });

      if (!confirmed) return;

      // Backup current data for rollback
      const backup = JSON.parse(JSON.stringify(state.data));

      const loading = Toast.show('Импорт…', 'info');
      let failed = 0;
      const succeeded = [];

      for (const type of ['levels', 'entities', 'items', 'foods']) {
        for (const obj of imported[type]) {
          Data.ensureDefaults(obj, type);
          const filename = `${type}/${type}_${obj.id}.json`;
          try {
            await API.commitFile(filename, obj);
            succeeded.push({ type, obj, filename });
          } catch (e) {
            failed++;
            console.error(`Failed to commit ${filename}:`, e);
          }
        }
      }

      Toast.dismiss(loading);

      if (failed > 0) {
        Toast.error(`Импортировано ${succeeded.length}, ошибок: ${failed}`, { duration: 5000 });
      } else {
        Toast.success(`Импортировано ${succeeded.length} записей`);
      }

      await loadAllSections();
      renderTree();
      renderContent();
    } catch (e) {
      Toast.error(`Ошибка импорта: ${e.message}`);
    }
  };
  input.click();
}

// ═══════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════

// Tabs
dom.topBar.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab-btn');
  if (tab) switchSection(tab.dataset.tab);

  const nav = e.target.closest('[data-nav]');
  if (nav) switchSection(nav.dataset.nav);
});

// Top bar actions
$('#luckyBtn').addEventListener('click', async () => {
  const all = [...state.data.levels, ...state.data.entities, ...state.data.items, ...state.data.foods];
  if (all.length === 0) { Toast.info('База пуста'); return; }
  const randomObj = all[Math.floor(Math.random() * all.length)];
  const type = state.data.levels.includes(randomObj) ? 'levels'
    : state.data.entities.includes(randomObj) ? 'entities'
    : state.data.items.includes(randomObj) ? 'items' : 'foods';
  await switchSection(type);
  openView(type, randomObj.id);
});

$('#refreshBtn').addEventListener('click', async () => {
  const loading = Toast.show('Синхронизация…', 'info');
  state.loaded.clear();
  state.loaded.add('home');
  state.cardCache = new WeakMap();
  await loadAllSections();
  Toast.dismiss(loading);
  renderTree();
  renderContent();
  Toast.success('Данные синхронизированы');
});

$('#addBtn').addEventListener('click', () => {
  if (state.section === 'home') { Toast.info('Сначала выберите раздел'); return; }
  openEditModal(state.section);
});

// Settings
dom.settingsBtn.addEventListener('click', () => {
  $('#settingsOwner').value = API.owner || '';
  $('#settingsRepo').value = API.repo || '';
  $('#settingsBranch').value = API.branch || 'main';
  $('#settingsToken').value = API.token || '';
  dom.settingsModal.classList.add('active');
  document.body.style.overflow = 'hidden';
});

$('#closeSettingsBtn').addEventListener('click', () => {
  dom.settingsModal.classList.remove('active');
  document.body.style.overflow = '';
});

$('#saveSettingsBtn').addEventListener('click', () => {
  Storage.set('gh_owner', $('#settingsOwner').value.trim());
  Storage.set('gh_repo', $('#settingsRepo').value.trim());
  Storage.set('gh_branch', $('#settingsBranch').value.trim() || 'main');
  Storage.set('gh_token', $('#settingsToken').value.trim());
  dom.settingsModal.classList.remove('active');
  document.body.style.overflow = '';
  Toast.success('Настройки сохранены. Перезагрузите данные (⟳)');
});

// Modal clicks
dom.viewModal.addEventListener('click', (e) => { if (e.target === dom.viewModal) closeView(); });
dom.editModal.addEventListener('click', (e) => { if (e.target === dom.editModal) closeEdit(); });
dom.settingsModal.addEventListener('click', (e) => { if (e.target === dom.settingsModal) { dom.settingsModal.classList.remove('active'); document.body.style.overflow = ''; }});
dom.lightbox.addEventListener('click', () => dom.lightbox.classList.remove('active'));

// Export/Import (delegated via home render)
dom.contentArea.addEventListener('click', (e) => {
  if (e.target.id === 'exportBtn') exportAllData();
  else if (e.target.id === 'importBtn') importAllData();
  else if (e.target.closest('.stat-card[data-section]')) {
    switchSection(e.target.closest('.stat-card').dataset.section);
  } else if (e.target.closest('.tag-cloud .tag')) {
    const tag = e.target.closest('.tag-cloud .tag').dataset.tag;
    switchSection('levels').then(() => {
      state.filters.tag = tag;
      renderContent();
    });
  }
});

// Mobile menu
dom.mobileMenuBtn.addEventListener('click', () => {
  dom.sidebar.classList.toggle('open');
});
dom.sidebarBackdrop.addEventListener('click', () => {
  dom.sidebar.classList.remove('open');
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  const isEditing = document.activeElement.matches('input, textarea, select');

  // ESC
  if (e.key === 'Escape') {
    if (dom.lightbox.classList.contains('active')) dom.lightbox.classList.remove('active');
    else if (dom.editModal.classList.contains('active')) closeEdit();
    else if (dom.viewModal.classList.contains('active')) closeView();
    else if (dom.settingsModal.classList.contains('active')) {
      dom.settingsModal.classList.remove('active');
      document.body.style.overflow = '';
    }
    return;
  }

  if (isEditing) return;

  // / → focus search
  if (e.key === '/') {
    const searchInput = $('#searchInputField');
    if (searchInput) { e.preventDefault(); searchInput.focus(); searchInput.select(); }
    return;
  }

  // N → new
  if (e.key === 'n' || e.key === 'N') {
    if (state.section !== 'home') openEditModal(state.section);
    return;
  }

  // R → random
  if (e.key === 'r' || e.key === 'R') {
    $('#luckyBtn').click();
    return;
  }
});

// Close sidebar on outside click (mobile)
document.addEventListener('click', (e) => {
  if (window.innerWidth <= 768 &&
      dom.sidebar.classList.contains('open') &&
      !dom.sidebar.contains(e.target) &&
      !dom.mobileMenuBtn.contains(e.target)) {
    dom.sidebar.classList.remove('open');
  }
});

// Warn on unload with dirty form
window.addEventListener('beforeunload', (e) => {
  if (state.editing?.dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// Configure marked
if (typeof marked !== 'undefined') {
  marked.setOptions({
    breaks: true,
    gfm: true
  });
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════

(async function init() {
  renderContent();
  renderTree();

  if (API.owner && API.repo) {
    showSkeletons();
    await loadAllSections();
    renderTree();
    renderContent();
  }
})();

})();
</script>
</body>
